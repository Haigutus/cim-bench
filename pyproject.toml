[project]
name = "cim-bench"
version = "0.1.0"
description = "Performance benchmarking suite for CIM parsers and serializers"
requires-python = ">=3.10"
dependencies = [
    "pytest>=9.0.2",
    "pytest-benchmark>=5.2.3",
    "triplets>=0.0.17",
    "pypowsybl>=1.14.0",
    "psutil>=7.2.2",
    "VeraGrid>=5.6.28",
    "cim-graph>=0.4.3a10",
]

[tool.uv]
exclude-newer = "P7D"

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.8.0",
]
