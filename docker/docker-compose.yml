# This is the single source of truth for what benchmarks to run
# Add/remove services here to control which benchmarks are executed

x-common: &common
  volumes:
    # Mount current source over the copies baked into the images, so code
    # changes don't require image rebuilds (granular iteration)
    - ../benchmarks:/benchmarks:ro,z
    - ../parsers:/benchmarks/parsers:ro,z
    - ../data:/benchmarks/data:ro,z
    - ../results-docker:/output:z
    - ../temp:/benchmarks/temp:z
  network_mode: none

services:
  triplets-svedala:
    <<: *common
    image: cim-bench/triplets:latest
    command: pytest triplets_svedala_benchmark.py --benchmark-only --benchmark-json=/output/triplets_svedala_benchmark.json

  triplets-realgrid:
    <<: *common
    image: cim-bench/triplets:latest
    command: pytest triplets_realgrid_benchmark.py --benchmark-only --benchmark-json=/output/triplets_realgrid_benchmark.json

